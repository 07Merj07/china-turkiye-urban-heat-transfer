name: project checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight check dependencies
        run: python -m pip install --upgrade pandas numpy nbformat
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check notebook syntax and credential literals
        run: python scripts/check_notebook_syntax.py
      - name: Audit the bundled sample files only
        run: python scripts/audit_uhi_sources.py --source data/sample_uhi/UHII_dataset --report /tmp/sample_uhi_inventory.csv --allow-partial
