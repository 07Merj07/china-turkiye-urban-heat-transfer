[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-heat-transfer"
version = "0.1.0"
description = "Cross-country transfer-learning research for urban heat island intensity in China and Türkiye"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0,<4.0", "numpy>=1.24,<3.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
